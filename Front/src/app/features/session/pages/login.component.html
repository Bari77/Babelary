<div class="auth-page">
    <mat-card class="auth-card">
        <mat-card-header>
            <mat-card-title>{{ "LOGIN.TITLE" | translate }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="submit()">
                <mat-form-field>
                    <mat-label>{{ "GLOBAL.EMAIL" | translate }}</mat-label>
                    <input matInput type="email" formControlName="email" autocomplete="username" />
                    @if (form.controls.email.invalid && form.controls.email.touched) {
                        <mat-error>{{ "ERROR.ERR_EMAIL_INVALID" | translate }}</mat-error>
                    }
                </mat-form-field>

                <mat-form-field>
                    <mat-label>{{ "GLOBAL.PASSWORD" | translate }}</mat-label>
                    <input
                        matInput
                        [type]="hidePassword() ? 'password' : 'text'"
                        formControlName="password"
                        autocomplete="current-password"
                    />
                    <button
                        mat-icon-button
                        matSuffix
                        type="button"
                        (click)="hidePassword.set(!hidePassword())"
                        [attr.aria-label]="'GLOBAL.PASSWORD' | translate"
                    >
                        <mat-icon>{{ hidePassword() ? "visibility" : "visibility_off" }}</mat-icon>
                    </button>
                </mat-form-field>

                @if (sessionStore.error()) {
                    <p class="form-error">{{ sessionStore.error() }}</p>
                }

                <button mat-flat-button type="submit" [disabled]="sessionStore.pending()">
                    @if (sessionStore.pending()) {
                        <mat-spinner diameter="18" />
                    } @else {
                        {{ "LOGIN.SUBMIT" | translate }}
                    }
                </button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
