name: CI - Front (Angular)

on:
    pull_request:
        paths:
            - "Front/**"
            - ".github/workflows/front-ci.yml"
    workflow_dispatch:

permissions:
    contents: read
    packages: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3

            - name: Install
              working-directory: Front
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  printf '\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> .npmrc
                  bun install --frozen-lockfile

            - name: Build
              working-directory: Front
              run: bun run build
