name: CD - Front (Docker)

on:
    push:
        branches:
            - develop
            - main
        paths:
            - "Front/**"
            - ".github/workflows/front-cd.yml"
            - ".github/workflows/docker-wf.yml"
    workflow_dispatch:

jobs:
    detect-version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4
            - name: Extract version from CHANGELOG.md
              id: version
              run: |
                  VERSION=$(grep -E '^## \[v[0-9]+\.[0-9]+\.[0-9]+' Front/CHANGELOG.md | head -1 | sed -E 's/## \[v(.+)\].*/\1/')
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

    publish:
        needs: detect-version
        uses: ./.github/workflows/docker-wf.yml
        with:
            directory: "Front"
            app_env: ${{ github.ref == 'refs/heads/develop' && 'staging' || 'prod' }}
            tag: ${{ github.ref == 'refs/heads/develop' && 'staging' || 'latest' }}
            image_name: "web"
            version: ${{ needs.detect-version.outputs.version }}
            run_number: ${{ github.run_number }}
        secrets: inherit
